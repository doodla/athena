[package]
name = "athena-core"
description = "Athena's core: the job lifecycle, the capability seam, snapshots, admission, checks, independent verification, landing, records commits, scoring, and status."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
athena-agent.workspace = true
athena-context.workspace = true
athena-data.workspace = true
athena-gate.workspace = true
athena-git.workspace = true
athena-score.workspace = true
jiff.workspace = true
# Code-health check: parses Rust source to measure function lengths (docs/decisions.md).
proc-macro2 = { version = "1", features = ["span-locations"] }
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
syn = { version = "2", default-features = false, features = ["full", "visit", "parsing", "printing", "clone-impls"] }
tempfile.workspace = true
thiserror.workspace = true
toml_edit.workspace = true

[features]
# Compiles `athena_core::test_support`, the shared history fixture, for other crates' tests. Off by default.
test-support = []

[lints]
workspace = true
