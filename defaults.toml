# Athena's model of its user's default expectations (design §13; D26).
#
# Every entry cites its source in the user's standing spec, BRIEF.md. The reader loads this model and names
# the entries that apply to a request; only those reach the producer's and verifier's briefs. This file is a
# governance file: changing it is a job, and each change cites the evidence that pulled it in.

version = 1

[[default]]
id = "rust"
statement = "All code is Rust. Non-Rust files appear only where a platform requires them, and each is listed with its reason."
applies_to = ["code", "build", "tests"]
source = "BRIEF.md A4"

[[default]]
id = "strangers"
statement = "Code, commits, docs, and records are written for an outside reader."
applies_to = ["*"]
source = "BRIEF.md Standards"

[[default]]
id = "evidence"
statement = "Claims cite their sources, and numbers are measured or labeled as estimates."
applies_to = ["docs", "design", "records"]
source = "BRIEF.md Standards"

[[default]]
id = "buy-first"
statement = "Adopt good, maintained tools and crates before building; build only for needs they don't meet, and record the call."
applies_to = ["code", "build"]
source = "BRIEF.md Standards"

[[default]]
id = "tested"
statement = "Every module has passing tests; cargo test passes and clippy is clean."
applies_to = ["code", "tests", "build"]
source = "BRIEF.md How I'll judge it"

[[default]]
id = "public"
statement = "Everything committed is public: no secrets, credentials, or personal data, and transcripts are redacted."
applies_to = ["*"]
source = "BRIEF.md Boundaries, A5"

[[default]]
id = "small"
statement = "Prefer one focused change; size is a design choice, not a wish list."
applies_to = ["*"]
source = "BRIEF.md O1"

[[default]]
id = "verified"
statement = "Done means independently verified, and user-facing behavior is verified by exercising it."
applies_to = ["*"]
source = "BRIEF.md A7"

[[default]]
id = "designed"
statement = "Significant designs are written down with alternatives and reviewed before they are built."
applies_to = ["design", "code"]
source = "BRIEF.md Standards"

[[default]]
id = "lazy-requests"
statement = "Requests are short; recover hidden requirements from the repository before asking."
applies_to = ["*"]
source = "BRIEF.md O2"

[[default]]
id = "mechanism"
statement = "Rules that matter are enforced by mechanism, or explicitly marked prose-only."
applies_to = ["code", "config", "build"]
source = "BRIEF.md A8"

[[default]]
id = "root-cause"
statement = "Fix the root cause, not the symptom or the one instance that surfaced. The fault is fixed where it originates; when that lies outside the job's scope, name it and propose the fix rather than working around it. The change description names the root cause and why the change addresses it. The root-cause fix is the one focused change."
applies_to = ["*"]
source = "BRIEF.md addendum '2026-10-13: Root causes'"

[[default]]
id = "behavior-evidence"
statement = "Acceptance criteria must check the requested behavior happening, not that types, files or wiring exist. A protection or denial test first shows the action succeeds without the protection, as the same user and in the same environment the real component runs as (root), then shows the action is refused. It fails, not skips or passes silently, if the environment cannot enforce the protection; a file mode that root bypasses is not proof. Worked examples are in docs/design/defaults-loop.md section 3.7."
applies_to = ["*"]
source = "job 20261015-141831-hyb4 (retry of 20261015-095214-y8kr): criteria checked wiring, not behavior"

[[default]]
id = "outcome-check"
statement = "The outcome is the check behind the work, not the activity done. For audience-facing quality, a fresh model reader that took no part in the work rates the live result as a newcomer, and a rating below 4 of 5 blocks completion. Prose-only: no loop code computes the rating yet."
applies_to = ["*"]
source = "job 20261015-095214-1egb: the user's standing request for an outcome check"

[[default]]
id = "no-empty-success"
statement = "An empty queue or finished list never counts as success on its own. Success needs a check of the outcome the list stood for. Prose-only: no loop code enforces it yet."
applies_to = ["*"]
source = "job 20261015-095214-1egb: the user's standing request that empty is not success"

[[default]]
id = "thrash-stop"
statement = "If the same item fails twice in a loop, the loop stops and reports thrashing. Prose-only: no loop code detects it yet."
applies_to = ["*"]
source = "job 20261015-095214-1egb: the user's standing request to stop on thrashing"
