# The critique ledger (OLY-B-S6-01). Validated by crates/athena-core/src/critique_ledger.rs and
# `cargo test -p athena-core --test critique_ledger`.
#
# Each [[entry]] has: id (unique), kind (critique | improvement | open_question), subject (what is critiqued;
# `athena` for Athena itself), status (open | accepted | done | dropped), text, and source (where the
# point comes from). No other keys are allowed.

[[entry]]
id = "L-001"
kind = "critique"
subject = "athena"
status = "open"
text = "The ledger check only shows that Athena has an entry and every kind is present. It does not show that Athena is critiqued as hard as Firstmate and Hermes."
source = "crates/athena-core/src/critique_ledger.rs, check_standard"

[[entry]]
id = "L-002"
kind = "improvement"
subject = "athena"
status = "open"
text = "Add severity, impact, effort and strongest-defense fields to the ledger once entries need ranking."
source = "docs/design/requirements-map.md, row S6-1"

[[entry]]
id = "L-003"
kind = "open_question"
subject = "athena"
status = "open"
text = "Should ledger entries be created from reviews and runs automatically, or stay written by hand?"
source = "BRIEF.md, S6 Critique"
