# A small shared vocabulary for Olympus: defined terms, how they relate, and where each is sourced.
#
# Rule: a term is added only when it has caused a misread. Each entry names the misread that caused it.
# This is not a formal ontology (D109).
#
# How a check reads this file (crates/athena-cli/tests/ontology.rs): parse it as TOML, then for every
# `[[term]]` require the string fields `name`, `definition` and `misread`, a non-empty `sources` list, and a
# `relations` list. Each source is a path that exists under the repository root, or a decision id (D plus
# digits) that has a "## Dnn" heading in docs/decisions.md. Each relation is a table with `kind` and `target`,
# and its target must be the `name` of a term in this file. Each optional `not_part_of` entry is a table with
# `what` and `source`, and its source is checked the same way. Term names are unique.

[about]
rule = "A term is added only when it causes a misread."
read_by = "crates/athena-cli/tests/ontology.rs"

[[term]]
name = "planning"
definition = """
Two different things carry this word. (1) Queue planning: `athena plan` orders the open requests by rung and
age. It is deterministic code and does not decide how a job's work is done. (2) Job planning: a planner and a
critic decide how the work will be done before the producer writes code. It is proposed, not built."""
misread = "Sri read 'planning first' as a planner of the work, but what was built was the queue ordering (D105)."
sources = ["D105", "docs/design/job-planning.md", "BRIEF.md"]
relations = [{ kind = "belongs_to", target = "job" }]

[[term]]
name = "job"
definition = """
One unit of work Athena runs for one request in one repository: a reading, a producer, checks, a verifier and a
verdict, each written as records under records/. A request is what Sri asks; a job is one attempt to do it, so
a retried request makes a new job."""
misread = "A request and a job were treated as one thing, so a rejected job looked like a rejected request."
sources = ["D01", "docs/records.md"]
relations = [{ kind = "run_by", target = "Athena" }, { kind = "asked_by", target = "Sri" }]

[[term]]
name = "Athena"
definition = """
Within Olympus, the strategy and learning role. The code, commands and records also keep the name Athena for
now, so the word names both the role and the program that does the work. Athena is not the whole system: the
system is Olympus."""
misread = "Athena was read as the whole system, because the code, commands and records all carry its name."
sources = ["BRIEF.md", "D01"]
relations = [
  { kind = "role_within", target = "product versus system" },
  { kind = "owned_by", target = "Sri" },
]
not_part_of = [
  { what = "Hermes Agent, the second studied system", source = "BRIEF.md" },
]

[[term]]
name = "Hermes"
definition = """
Two things share this name. (1) Hermes Agent, a single self-improving agent that writes its own skills: the
second system studied in Part 2 (S1) of the Athena brief. It is not part of Athena and not part of Olympus.
(2) Hermes, the Orchestration god in the Olympus Pantheon, which routes work and manages dependencies,
context and structured hand-overs. Only this second sense is part of Olympus."""
misread = "The studied agent and the Orchestration god were read as one, or Hermes Agent as a part of Athena."
sources = ["BRIEF.md", "docs/design/roadmap.md"]
relations = [{ kind = "god_within", target = "product versus system" }]
not_part_of = [
  { what = "Hermes Agent is not part of Athena", source = "BRIEF.md" },
  { what = "Hermes Agent is not part of Olympus; it is a studied system", source = "docs/design/roadmap.md" },
]

[[term]]
name = "product versus system"
definition = """
The system is Olympus: Sri's whole arrangement of roles, code and records, of which Athena is the strategy and
learning role. The first product is the study: Part 2 of the Athena brief, with the site and the final report,
that is `studies/`, the site generator and the Pages workflow. Everything else is the system, so a product fix
that needs a system change is Loop B work."""
misread = "A fix to the study was treated as a change to the product only, when it needed a change to the system."
sources = ["BRIEF.md", "docs/design/strategy-view.md"]
relations = [{ kind = "owned_by", target = "Sri" }]

[[term]]
name = "landed"
definition = """
Merged on main through a verified pull request. A candidate that passed its checks, or a branch that was pushed,
has not landed."""
misread = "Passing checks or an open pull request was reported as landed."
sources = ["D10", "docs/design/native-pr-landing.md"]
relations = [{ kind = "follows", target = "job" }]

[[term]]
name = "Sri"
definition = """
The owner of Olympus (Zeus). Refer to Sri by the name, or with 'they'; never he or she. Sri's words, verbatim
and append-only, are the record in BRIEF.md."""
misread = "Sri was referred to with a gendered pronoun, corrected in job 20261017-173504-91ys."
sources = ["BRIEF.md"]
relations = [{ kind = "owns", target = "product versus system" }]
