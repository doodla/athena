# Iris spend ledger (OLY-B-SET-04).
#
# Generated images and assets come from Iris within a $15 lifetime budget. The cap is 1500 cents and lives
# in crates/athena-core/src/iris.rs (LIFETIME_CAP_CENTS), not here, so editing this file cannot raise it.
#
# Amounts are whole cents. Each spend is one table:
#
#   [[entry]]
#   date = "YYYY-MM-DD"
#   cents = 250
#   note = "what was generated"
#
# Append an entry only after check_generation allowed the generation. This file holds amounts only: no
# credentials, keys or account data. The parser refuses any key other than date, cents and note.
