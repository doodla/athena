# ---------------------------------------------------------------- Section 5: The two loops

[[requirement]]
id = "OLY-5-01"
statement = "Olympus operates through two connected loops."
kind = "constraint"
status = "active"
[[requirement.source]]
heading = "5. A unified engineering and learning lifecycle"
quote = '''Olympus should operate through two connected loops.'''

[[requirement]]
id = "OLY-5-02"
statement = "Loop A delivers outcomes: intent, planning, decomposition, execution, verification, delivery, observation. It produces software and other engineering artifacts."
kind = "requirement"
status = "active"
[[requirement.source]]
heading = "Loop A — Deliver outcomes"
quote = '''Intent → Planning → Decomposition → Execution → Verification → Delivery → Observation'''
[[requirement.source]]
heading = "Loop A — Deliver outcomes"
quote = '''This loop produces software and other engineering artifacts.'''

[[requirement]]
id = "OLY-5-03"
statement = "Loop B improves the system: observations, diagnosis, hypotheses, improvement proposals, experiments, evaluation, adoption or rejection. It improves the capabilities and decisions Loop A uses."
kind = "requirement"
status = "active"
[[requirement.source]]
heading = "Loop B — Improve the system"
quote = '''Observations → Diagnosis → Hypotheses → Improvement proposals → Experiments → Evaluation → Adoption or rejection'''
[[requirement.source]]
heading = "Loop B — Improve the system"
quote = '''This loop improves the capabilities and decisions used by Loop A.'''

[[requirement]]
id = "OLY-5-04"
statement = "Neither loop owns the other."
kind = "constraint"
status = "active"
[[requirement.source]]
heading = "Loop B — Improve the system"
quote = '''Neither loop owns the other.'''

[[requirement]]
id = "OLY-5-05"
statement = "Improvement work follows the same engineering discipline as product work, with stronger governance when it touches the system's own evaluation or authority boundaries."
kind = "constraint"
status = "active"
[[requirement.source]]
heading = "Loop B — Improve the system"
quote = '''Improvement work goes through the same engineering discipline as ordinary product work, with stronger governance when it touches the system's own evaluation or authority boundaries.'''

[[requirement]]
id = "OLY-5-06"
statement = "An improvement proposal states what it intends to change, from targets such as requirements discovery, planning, context and memory, role selection, coordination, tool access, conventions, verification, release checks, user communication and the harness's own monitoring."
kind = "requirement"
status = "active"
[[requirement.source]]
heading = "5.1 Improvements target mechanisms"
quote = '''An improvement proposal must identify what it intends to change.'''
[[requirement.source]]
heading = "5.1 Improvements target mechanisms"
quote = '''Potential targets include:'''
[[requirement.source]]
heading = "5.1 Improvements target mechanisms"
quote = '''The harness's own monitoring and evaluation.'''

[[requirement]]
id = "OLY-5-07"
statement = "Athena favors the narrowest change that addresses a demonstrated general weakness, and a safeguard addresses a meaningful class of failure without imposing inappropriate universal rules."
kind = "constraint"
status = "active"
[[requirement.source]]
heading = "5.1 Improvements target mechanisms"
quote = '''Athena should favor the narrowest change that addresses a demonstrated general weakness.'''
[[requirement.source]]
heading = "R3 — Generalizable prevention"
quote = '''The safeguard should address a meaningful class of failure without imposing inappropriate universal rules.'''

[[requirement]]
