kind = "acceptance"
status = "active"
[[requirement.source]]
heading = "1. Vision"
quote = '''Investigate how the problem originated.'''
[[requirement.source]]
heading = "1. Vision"
quote = '''Identify why planning, implementation, or verification failed to prevent it.'''

[[requirement]]
id = "OLY-1-06"
