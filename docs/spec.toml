# ---- 4. Example ----

[[requirement]]
id = "E-01"
statement = "To start, Athena identifies the expected behavior, Aphrodite examines the intended interaction model, and Hephaestus reproduces the issue."
kind = "requirement"
status = "active"
[[requirement.source]]
quote = "Athena identifies the expected navigation behavior. Aphrodite examines the intended interaction model. Hephaestus reproduces the issue."
heading = "4. Example: \"Back doesn't work here\" / Stage A — Understand and reproduce"

[[requirement]]
id = "E-02"
statement = "After the repair, Apollo verifies the original reproduction now succeeds and Ares tests neighbouring cases, so the user-visible defect is resolved."
kind = "acceptance"
status = "active"
[[requirement.source]]
quote = "Apollo verifies the original reproduction now succeeds."
heading = "4. Example: \"Back doesn't work here\" / Stage B — Repair the immediate defect"
[[requirement.source]]
quote = "Ares tests neighboring cases, including nested navigation, browser history, direct links, and interrupted flows, where applicable."
heading = "4. Example: \"Back doesn't work here\" / Stage B — Repair the immediate defect"

[[requirement]]
id = "E-03"
statement = "The implementation defect and the process failure are separate findings, and Athena investigates the evidence rather than assuming a cause."
kind = "requirement"
status = "active"
[[requirement.source]]
quote = "The implementation defect and the process failure are different findings."
heading = "4. Example: \"Back doesn't work here\" / Stage C — Investigate how the defect escaped"
[[requirement.source]]
quote = "Athena must investigate the evidence rather than automatically assuming that missing acceptance criteria caused the defect."
heading = "4. Example: \"Back doesn't work here\" / Stage C — Investigate how the defect escaped"

[[requirement]]
id = "E-04"
statement = "Pipeline improvements are evaluated independently, and not all are assumed justified. The mechanism, failure mode and reusable remedy are recorded as knowledge."
kind = "requirement"
status = "active"
[[requirement.source]]
quote = "These changes should be independently evaluated. Not all will necessarily be justified."
heading = "4. Example: \"Back doesn't work here\" / Stage D — Improve the pipeline"
[[requirement.source]]
quote = "Record the mechanism, failure mode, and reusable remedy."
heading = "4. Example: \"Back doesn't work here\" / Stage D — Improve the pipeline"

[[requirement]]
id = "E-05"
statement = "An improvement is proven to generalize: Apollo runs the revised workflow on new tasks and past failures, Ares tries variations of the defect, and Athena compares cost and extra work. A rule with excessive overhead or false alarms may be rejected."
kind = "acceptance"
status = "active"
[[requirement.source]]
quote = "Apollo evaluates the revised workflow against new navigation tasks and previous failure cases."
heading = "4. Example: \"Back doesn't work here\" / Stage E — Prove that the improvement generalizes"
[[requirement.source]]
quote = "Ares deliberately introduces variations of the original defect to test whether the new safeguards catch them."
heading = "4. Example: \"Back doesn't work here\" / Stage E — Prove that the improvement generalizes"
[[requirement.source]]
quote = "A rule that catches one example but introduces excessive overhead or false alarms may be rejected."
heading = "4. Example: \"Back doesn't work here\" / Stage E — Prove that the improvement generalizes"

[[requirement]]
id = "E-06"
statement = "Olympus tracks whether comparable failures become rarer. If safeguards still miss cases, the feedback stays relevant to later improvement proposals."
kind = "requirement"
status = "active"
[[requirement.source]]
quote = "Olympus tracks whether comparable navigation failures become less frequent."
heading = "4. Example: \"Back doesn't work here\" / Stage F — Observe future outcomes"
[[requirement.source]]
quote = "If the safeguards still miss cases, the feedback remains relevant to subsequent improvement proposals."
heading = "4. Example: \"Back doesn't work here\" / Stage F — Observe future outcomes"

[[requirement]]
id = "E-07"
statement = "The original report stays part of a traceable chain from user observation to measured learning."
kind = "requirement"
status = "active"
[[requirement.source]]
quote = "User observation → Product repair → Root-cause investigation → Process improvement → Independent evaluation → Measured learning."
heading = "4. Example: \"Back doesn't work here\" / Stage F — Observe future outcomes"

# ---- 5. Lifecycle with two loops ----

[[requirement]]
id = "L-01"
statement = "Olympus runs two connected loops: A delivers outcomes, B improves the system."
kind = "requirement"
status = "active"
[[requirement.source]]
quote = "Olympus should operate through two connected loops."
heading = "5. A unified engineering and learning lifecycle"

[[requirement]]
id = "L-02"
statement = "Loop A runs Intent, Planning, Decomposition, Execution, Verification, Delivery, Observation, and produces software and other engineering artifacts."
kind = "requirement"
status = "active"
[[requirement.source]]
quote = "Intent → Planning → Decomposition → Execution → Verification → Delivery → Observation"
heading = "5. A unified engineering and learning lifecycle / Loop A — Deliver outcomes"
[[requirement.source]]
quote = "This loop produces software and other engineering artifacts."
heading = "5. A unified engineering and learning lifecycle / Loop A — Deliver outcomes"

[[requirement]]
id = "L-03"
statement = "Loop B runs Observations, Diagnosis, Hypotheses, Improvement proposals, Experiments, Evaluation, Adoption or rejection, and improves the capabilities and decisions Loop A uses."
kind = "requirement"
status = "active"
[[requirement.source]]
quote = "Observations → Diagnosis → Hypotheses → Improvement proposals → Experiments → Evaluation → Adoption or rejection"
heading = "5. A unified engineering and learning lifecycle / Loop B — Improve the system"
[[requirement.source]]
quote = "This loop improves the capabilities and decisions used by Loop A."
heading = "5. A unified engineering and learning lifecycle / Loop B — Improve the system"

[[requirement]]
id = "L-04"
statement = "Neither loop owns the other."
kind = "constraint"
status = "active"
[[requirement.source]]
quote = "Neither loop owns the other."
heading = "5. A unified engineering and learning lifecycle / Loop B — Improve the system"

[[requirement]]
id = "L-05"
statement = "Improvement work follows the same engineering discipline as product work, with stronger governance when it touches the system's own evaluation or authority boundaries."
kind = "constraint"
status = "active"
[[requirement.source]]
quote = "Improvement work goes through the same engineering discipline as ordinary product work, with stronger governance when it touches the system's own evaluation or authority boundaries."
heading = "5. A unified engineering and learning lifecycle / Loop B — Improve the system"

[[requirement]]
id = "L-06"
statement = "An improvement proposal names what it intends to change, from targets such as requirements discovery, planning, context, role selection, coordination, tools, tests, release checks, user communication or the harness's own monitoring."
kind = "requirement"
status = "active"
[[requirement.source]]
quote = "An improvement proposal must identify what it intends to change."
heading = "5. A unified engineering and learning lifecycle / 5.1 Improvements target mechanisms"
[[requirement.source]]
quote = "The harness's own monitoring and evaluation."
heading = "5. A unified engineering and learning lifecycle / 5.1 Improvements target mechanisms"

[[requirement]]
id = "L-07"
statement = "Athena favours the narrowest change that fixes a demonstrated general weakness."
kind = "constraint"
status = "active"
[[requirement.source]]
quote = "Athena should favor the narrowest change that addresses a demonstrated general weakness."
heading = "5. A unified engineering and learning lifecycle / 5.1 Improvements target mechanisms"

[[requirement]]
id = "L-08"
statement = "A new prompt instruction is not automatically a satisfactory improvement; a test, tool, invariant, interface or deterministic mechanism may be more reliable."
kind = "constraint"
status = "active"
[[requirement.source]]
quote = "A new instruction in a prompt is not automatically a satisfactory improvement."
heading = "5. A unified engineering and learning lifecycle / 5.1 Improvements target mechanisms"
