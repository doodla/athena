statement = "Olympus is a system of specialized agents that together plan, build, verify, maintain and improve software."
kind = "goal"
status = "active"
[[requirement.source]]
heading = "1. Vision"
quote = '''Olympus is a system of specialized agents that collectively plan, build, verify, maintain, and improve software.'''

[[requirement]]
