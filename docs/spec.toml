[[requirement]]
id = "OLY-1-09"
statement = "The user supplies direction, corrections, expectations and judgments; the system takes responsibility for turning those signals into effective engineering work."
kind = "requirement"
status = "active"
[[requirement.source]]
heading = "1. Vision"
quote = '''The user supplies direction, corrections, expectations, and judgments. The pantheon takes responsibility for turning those signals into effective engineering work.'''

[[requirement]]
