# The Olympus spec, first part: BRIEF.md "Project Olympus" sections 1 to 6 (D111).
#
# Sections 7 to 10, the governing philosophy and the 2026-10-17 addenda follow in a second job.
#
# Format. Each `[[requirement]]` has:
#   id         unique label
#   statement  one plain sentence or two
#   kind       goal | requirement | constraint | acceptance
#   status     active | superseded
#   supersedes optional list of ids this requirement replaces (each must exist)
#   `[[requirement.source]]` one or more, each with `quote` (a verbatim passage of BRIEF.md, compared after
#              collapsing whitespace) and `heading` (the section path, "/"-separated, whose last part is a
#              heading line of BRIEF.md)
# Each `[[open_question]]` has id, question, and two or more `[[open_question.source]]` quotes where Sri's words
# conflict or leave a choice open. It stays unresolved here. If there is none, `no_open_questions_reason`
# says so.
#
# xtask/tests/spec.rs checks every quote, id, target and source.

no_open_questions_reason = "Sections 1 to 6 state one coherent design. 'Neither loop owns the other' (section 5) describes how the loops relate, and does not conflict with Athena's role in section 2. Each 'may' or 'should' is a stated permission or preference, not an unmade choice between two of Sri's statements."

