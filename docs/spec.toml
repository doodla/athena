statement = "The system must improve both the product it builds and the process by which it builds that product."
kind = "requirement"
status = "active"
[[requirement.source]]
heading = "1. Vision"
quote = '''The pantheon must be capable of improving both the product it builds and the process by which it builds that product.'''

[[requirement]]
id = "OLY-1-03"
statement = "Its defining capability is turning observations into progressively better engineering behavior."
kind = "goal"
status = "active"
[[requirement.source]]
heading = "1. Vision"
quote = '''Its defining capability is turning observations into progressively better engineering behavior.'''

[[requirement]]
