# The cohesive spec, first layer: BRIEF.md "Project Olympus" sections 1 to 6 (decision D114).
#
# Format. Each [[requirement]] has:
#   id         unique, "OLY-<section>-<nn>"
#   statement  one plain, cohesive sentence in our own words
#   kind       goal | requirement | constraint | acceptance
#   status     active | superseded
#   supersedes optional: ids of requirements this one replaces (each must exist)
#   [[requirement.source]]  one or more, each with
#     heading  the BRIEF.md heading the quote sits under, without the # marks
#     quote    a verbatim passage of that heading's own text (whitespace may differ)
# Duplicates in the brief are one requirement with several sources. A conflict or open choice in the
# owner's words would be an [[open_question]] with two or more sides (heading and quote each), recorded
# and never resolved. Sections 1 to 6 hold none; the open questions of the second layer are at the end.
#
# Every active requirement also says how it is met, in three more fields (written after the id):
#   mechanism  the code path, role or check that meets it, or the literal "none" when nothing does
#   owner      the role responsible for it (never "none")
#   measure    how it is shown, ending with "status: <label>", where the label is a line `athena status`
#              prints (the table STATUS_MEASURE_LABELS in crates/athena-core/src/status.rs), or
#              "status: not shown" with the test or check that shows it
# A requirement whose mechanism is "none", or whose measure is blank or names a label `athena status` does
# not print, is listed by `athena status`, and the Hestia sweep queues one request for it (Athena::spec_review
# in crates/athena-core/src/hestia.rs; urgent when the measure is shown in the throughput or checks section,
# since that requirement is about speed). A superseded requirement is exempt.
#
# xtask/tests/spec.rs checks every quote against the text under its heading, the ids, the supersedes
# targets, the sources, that every active requirement has the three fields above, and that every heading of
# BRIEF.md with text under it (including every dated addendum) is the first source heading of some requirement.
# Quotes are written as literal strings so that quotation marks and apostrophes need no escaping.
# Sections 7 to 10, the governing philosophy and the addenda of 2026-10-17 to 2026-10-24 follow (second layer);
# the rest of the brief follows them (third layer), and the open questions come last.

