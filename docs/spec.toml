# The cohesive spec, first layer: BRIEF.md "Project Olympus" sections 1 to 6 (decision D114).
#
# Format. Each [[requirement]] has:
#   id         unique, "OLY-<section>-<nn>"
#   statement  one plain, cohesive sentence in our own words
#   kind       goal | requirement | constraint | acceptance
#   status     active | superseded
#   supersedes optional: ids of requirements this one replaces (each must exist)
#   [[requirement.source]]  one or more, each with
#     heading  the BRIEF.md heading the quote sits under, without the # marks
#     quote    a verbatim passage of that heading's own text (whitespace may differ)
# Duplicates in the brief are one requirement with several sources. A conflict or open choice in the
# owner's words would be an [[open_question]] with two or more sides (heading and quote each), recorded
# and never resolved. Sections 1 to 6 hold none; the open questions of the second layer are at the end.
#
# xtask/tests/spec.rs checks every quote against the text under its heading, the ids, the supersedes
# targets, the sources, and that R1 to R8 and sections 1 to 5 each have a requirement. Quotes are
# written as multi-line literal strings so that quotation marks and apostrophes need no escaping.
# Sections 7 to 10, the governing philosophy and the addenda of 2026-10-17 to 2026-10-24 follow (second layer).

# ---------------------------------------------------------------- Section 1: Vision

[[requirement]]
