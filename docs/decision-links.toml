# The confirmed supersession and amend hits of docs/decisions.md (docs/design/decision-sets.md section 8, step 2).
#
# One [[link]] per pair of entries that a phrase of the log names: the `older` entry that is superseded or
# amended, the `newer` entry that does it, and the confirmed `status`:
#   superseded  nothing of the older decision still stands (it leaves every brief);
#   amended     the older decision is revised in part, or in prose only, and stays active.
# The phrase in the log does not decide the status: this list does (decision-sets.md section 6, step 3).
#
# The key of a link is its pair of ids, `older` and `newer`. Where the phrase stands in the log does not matter,
# so inserting entries or text into docs/decisions.md breaks nothing here, and two phrases that name one pair
# share one link (D46 by D79, D87 by D88). A link resolves when some phrase of the log names its pair:
# "Amends <older>" or "Supersedes <older>" inside the newer entry, or "Superseded by <newer>" inside the older
# one. A decision that was checked and stands is written "Amends <older> in prose only" in the new entry, with an
# `amended` link here.
#
# Two checks read this list. `athena backtest` condition (a) compares the parse of the log with it: a phrase
# whose pair is missing here, or a pair listed here that no phrase names, is a finding. And a job that edits
# docs/decisions.md is held before the verifier when a link of this list no longer resolves, when a phrase the
# change adds has no link, or when a phrase opens a statement without an id (D187).
#
# Confirmed by the user: D11 by D39 is a known, partial revision (amended). The remaining links are the parse's
# own reading of the log and are listed for the user to confirm.
#
# The [[governs]] tables at the end of the file link a decision to the code it governs (D156). Each has the
# `decision` id and the `paths` it governs: an exact file, or a directory prefix that ends in `/`, relative to
# the repository root. A change that touches one of those paths (added, changed, deleted or renamed) fails before
# the verifier starts unless the same change reconciles the decision: it adds an entry to docs/decisions.md that
# says "Amends <id>" or "Supersedes <id>" and a [[link]] above whose `older` is the governed decision and whose
# `newer` is that new entry. The link's status is not read: `amended` and `superseded` both reconcile, so a
# change that reverses nothing adds a one-line entry that says "Amends <id> in prose only", with an `amended`
# link. The list at the change's base commit decides, so a change cannot remove its own entry. A governed id
# must be an entry of the log.

