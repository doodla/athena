# The confirmed supersession and amend hits of docs/decisions.md (docs/design/decision-sets.md section 8, step 2).
#
# One [[link]] per phrase the parse of the log finds: its `line` in docs/decisions.md, the `older` entry that is
# superseded or amended, the `newer` entry that does it, and the confirmed `status`:
#   superseded  nothing of the older decision still stands (it leaves every brief);
#   amended     the older decision is revised in part, or in prose only, and stays active.
# The phrase in the log does not decide the status: this list does (decision-sets.md section 6, step 3).
#
# `athena backtest` condition (a) compares the parse with this list. A hit missing here, or listed here and not
# found in the log, is a finding. If docs/decisions.md changes line numbers, update the lines here.
#
# Confirmed by the user: D11 by D39 (line 322) is a known, partial revision (amended). The remaining hits are
# the parse's own reading of the log and are listed for the user to confirm.
#
# The [[governs]] tables at the end of the file link a decision to the code it governs (D156). Each has the
# `decision` id and the `paths` it governs: an exact file, or a directory prefix that ends in `/`, relative to
# the repository root. A change that touches one of those paths (added, changed, deleted or renamed) fails before
# the verifier starts unless the same change reconciles the decision: it adds an entry to docs/decisions.md and
# a [[link]] above whose `older` is the governed decision and whose `newer` is that new entry. The link's status
# is not read: `amended` and `superseded` both reconcile, so a change that reverses nothing adds a one-line
# entry that says the decision was checked and stands, with an `amended` link. The list at the change's base
# commit decides, so a change cannot remove its own entry. The `line` of the new link must match the phrase in
# the entry (condition (a) above). A governed id must be an entry of the log.

