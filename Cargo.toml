# Athena: an agent orchestration system. See README.md and docs/architecture.md.
[workspace]
resolver = "3"
members = [
    "crates/athena-data",
    "crates/athena-score",
    "crates/athena-git",
    "crates/athena-gate",
    "crates/athena-context",
    "crates/athena-agent",
    "crates/athena-core",
    "crates/athena-cap-change",
    "crates/athena-cap-study",
    "crates/athena-cli",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/doodla/athena"
publish = false

[workspace.dependencies]
athena-data = { path = "crates/athena-data" }
athena-score = { path = "crates/athena-score" }
athena-git = { path = "crates/athena-git" }
athena-gate = { path = "crates/athena-gate" }
athena-context = { path = "crates/athena-context" }
athena-agent = { path = "crates/athena-agent" }
athena-core = { path = "crates/athena-core" }
athena-cap-change = { path = "crates/athena-cap-change" }
athena-cap-study = { path = "crates/athena-cap-study" }
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
flate2 = "1"
getrandom = "0.3"
jiff = { version = "0.2", features = ["serde"] }
libc = "0.2"
regex = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1"
tar = "0.4"
tempfile = "3"
thiserror = "2"
toml = "0.9"
toml_edit = "0.23"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = false
